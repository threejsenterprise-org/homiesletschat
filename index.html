<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- ===== PRIMARY SEO ===== -->
    <title>HomiesLetsChat – Private Chat App for Friends & Groups</title>
    <meta name="description" content="HomiesLetsChat is a free, private, real-time messaging app for friends and groups. Chat with stickers, emojis, read receipts, and dark mode. No ads, no tracking." />
    <meta name="keywords" content="homiesletschat, private chat, free chat app, group messaging, real-time messaging, secure chat, friends chat, dark mode chat" />
    <link rel="canonical" href="https://threejsenterprise-org.github.io/homiesletschat/" />

    <!-- ===== OPEN GRAPH ===== -->
    <meta property="og:title" content="HomiesLetsChat – Private Chat for Friends" />
    <meta property="og:description" content="HomiesLetsChat is a free, private, real-time messaging app for friends and groups. Dark mode, stickers, and read receipts." />
    <meta property="og:url" content="https://threejsenterprise-org.github.io/homiesletschat/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HomiesLetsChat" />

    <!-- ===== JSON-LD STRUCTURED DATA ===== -->
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "WebApplication",
            "name": "HomiesLetsChat",
            "url": "https://threejsenterprise-org.github.io/homiesletschat/",
            "description": "HomiesLetsChat is a free, private, real-time messaging app for friends and groups. Chat with stickers, emojis, read receipts, and dark mode.",
            "applicationCategory": "Communication",
            "operatingSystem": "All",
            "browserRequirements": "Requires JavaScript",
            "offers": {
                "@type": "Offer",
                "price": "0",
                "priceCurrency": "USD"
            }
        }
    </script>

    <!-- ===== PWA ===== -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0b0a14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />

    <!-- Emoji Picker -->
    <script src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1.18.3/index.browser.js" defer></script>

    <!-- Real viewport height fix for mobile -->
    <script>
        function setRealVH() {
            document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px');
        }
        setRealVH();
        window.addEventListener('resize', setRealVH);
        window.addEventListener('orientationchange', setRealVH);
    </script>

    <style>
        /* ===== RESET & GLOBAL ===== */
        :root {
            --bg-main: #07050d;
            --bg-sidebar: #0f0c1a;
            --bg-panel: #1c1930;
            --bg-hover: #151228;
            --bg-active: #241f42;
            --accent-purple: #7C5CFC;
            --accent-teal: #22c55e;
            --text-primary: #ffffff;
            --text-secondary: #8b81b0;
            --msg-received: #1c1a2e;
            --msg-sent-gradient: linear-gradient(135deg, #6D5DF6, #8B5CF6);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        html,
        body {
            height: 100%;
            height: 100dvh;
            overflow: hidden;
        }
        body {
            background: #07050d;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #app-container {
            width: 100%;
            height: 100vh;
            height: calc(var(--vh, 1vh) * 100);
            height: 100dvh;
            background: #0b0a14;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            border: none;
        }
        @media (min-width: 1200px) {
            #app-container {
                border: 1px solid #161228;
                border-radius: 12px;
                max-width: 1400px;
                max-height: 90vh;
                box-shadow: 0 12px 40px rgba(0, 0, 0, 0.8);
            }
        }
        @media (max-width: 700px) {
            #app-container {
                border-radius: 0;
                border: none;
                max-width: 100%;
                max-height: 100vh;
            }
        }

        /* ===== LOADING SCREEN ===== */
        #loading-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            background: #0b0a14;
            color: white;
            padding: 20px;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }
        #loading-screen .logo {
            font-size: 4rem;
            margin-bottom: 10px;
            animation: pulse 1.5s ease-in-out infinite;
        }
        #loading-screen h1 {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 2px;
            color: #7C5CFC;
            margin-bottom: 20px;
        }
        #loading-screen .loader {
            width: 40px;
            height: 40px;
            border: 4px solid #1c1930;
            border-top: 4px solid #7C5CFC;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }
        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* ============================================================
           NEW AUTHENTICATION PAGE (Login / Sign‑up)
           ============================================================ */
        #login-screen {
            display: none;
            height: 100%;
            background: #0b0a14;
            overflow: hidden;
        }
        #login-screen.active {
            display: flex;
            flex-direction: column;
        }

        /* candy gradient text */
        .logo-candy {
            background: linear-gradient(90deg, #db3bbf, #8b5cf6);
            background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        .auth-container {
            display: flex;
            flex: 1;
            width: 100%;
            height: 100%;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Left side: brand */
        .auth-brand {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            color: white;
        }
        .auth-brand .brand-icon {
            font-size: 5rem;
            margin-bottom: 20px;
            animation: pulse 2s ease-in-out infinite;
        }
        .auth-brand h1 {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            line-height: 1.2;
        }
        .auth-brand .slogan {
            font-size: 1.2rem;
            color: #aebac1;
            margin-top: 10px;
            max-width: 400px;
        }
        .auth-brand .features {
            display: flex;
            gap: 20px;
            margin-top: 30px;
            font-size: 0.95rem;
            color: #8b81b0;
        }
        .auth-brand .features span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Right side: card */
        .auth-card-wrapper {
            flex: 1;
            perspective: 1500px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            min-height: 500px;
        }
        .auth-card {
            width: 100%;
            max-width: 420px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 860ms cubic-bezier(0.4, 0, 0.2, 1);
            min-height: 380px;
        }
        .auth-card.show-signup {
            transform: rotateY(-180deg);
        }

        .auth-side {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            background: rgba(28, 25, 48, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px 32px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
        }
        .auth-side h2 {
            color: #e9edef;
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .auth-side p {
            color: #8b81b0;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }
        .auth-side .google-btn {
            width: 100%;
            background: #242038;
            color: #e9edef;
            border: 1px solid #3a3358;
            padding: 14px 20px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 20px;
        }
        .auth-side .google-btn:hover {
            background: #2c2748;
            border-color: #7C5CFC;
        }
        .auth-side .google-btn img {
            width: 20px;
            height: 20px;
        }
        .auth-side .toggle-link {
            color: #7C5CFC;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
            background: none;
            border: none;
            display: inline-block;
            align-self: center;
        }
        .auth-side .toggle-link:hover {
            text-decoration: underline;
        }

        .auth-side.signup-side {
            transform: rotateY(180deg);
        }

        /* Responsive */
        @media (max-width: 850px) {
            .auth-container {
                flex-direction: column;
                padding: 10px;
                gap: 20px;
            }
            .auth-brand .brand-icon {
                font-size: 3.5rem;
            }
            .auth-brand h1 {
                font-size: 2.5rem;
            }
            .auth-card-wrapper {
                width: 100%;
                padding: 0 10px;
                min-height: 400px;
            }
            .auth-side {
                padding: 30px 24px;
            }
            .auth-brand .features {
                flex-wrap: wrap;
                justify-content: center;
            }
        }

        /* ===== REST OF THE APP (same as before) ===== */
        /* ... (all existing styles for sidebar, chat, modals, etc.) ... */
        /* I'll include the full rest of the CSS here, but for brevity in this answer,
           I'm assuming you already have the complete CSS from the previous version.
           In the final code block I'll provide the full thing. */
    </style>
</head>
<body>
    <div id="app-container">

        <!-- ======== LOADING SCREEN ======== -->
        <div id="loading-screen">
            <div class="logo">💬</div>
            <h1>HomiesLetsChat</h1>
            <div class="loader"></div>
        </div>

        <!-- ======== LOGIN / SIGN-UP SCREEN ======== -->
        <div id="login-screen">
            <div class="auth-container">
                <!-- Left: Brand -->
                <div class="auth-brand">
                    <div class="brand-icon">💬</div>
                    <h1><span class="logo-candy">HomiesLetsChat</span></h1>
                    <p class="slogan">The private, free, real-time chat for your friends and groups.</p>
                    <div class="features">
                        <span><i class="fas fa-check-circle" style="color:#7C5CFC;"></i> No ads</span>
                        <span><i class="fas fa-check-circle" style="color:#7C5CFC;"></i> Dark mode</span>
                        <span><i class="fas fa-check-circle" style="color:#7C5CFC;"></i> Stickers &amp; emojis</span>
                    </div>
                </div>

                <!-- Right: Card -->
                <div class="auth-card-wrapper">
                    <div class="auth-card" id="auth-card">
                        <!-- Sign In Side -->
                        <div class="auth-side login-side">
                            <h2>Welcome back</h2>

                                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" />

                            </button>
                            <button class="toggle-link" id="toggle-to-signup">New here? Create account</button>

                        <!-- Sign Up Side -->
                        <div class="auth-side signup-side">
                            <h2>Join the crew</h2>
                            <p>Create your free account and start chatting instantly.</p>
                            <button class="google-btn" id="signup-btn">
                                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" />
                                Sign up with Google
                            </button>
                            <button class="toggle-link" id="toggle-to-login">Already have an account? Sign in</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ======== MAIN APP (unchanged) ======== -->
        <div id="app-screen">
            <!-- Icon rail, sidebar, chat window – same as before -->
            <!-- ... (full content) ... -->
        </div>

        <!-- ======== TOAST, MODALS, CONTEXT MENU (unchanged) ======== -->
        <!-- ... -->

    </div>

    <script>
        // ============================================================
        // NEW LOGIN PAGE LOGIC
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {

            const authCard = document.getElementById('auth-card');
            const toggleToSignup = document.getElementById('toggle-to-signup');
            const toggleToLogin = document.getElementById('toggle-to-login');
            const loginBtn = document.getElementById('login-btn');
            const signupBtn = document.getElementById('signup-btn');

            // Flip card
            toggleToSignup.addEventListener('click', function(e) {
                e.preventDefault();
                authCard.classList.add('show-signup');
            });
            toggleToLogin.addEventListener('click', function(e) {
                e.preventDefault();
                authCard.classList.remove('show-signup');
            });

            // Both buttons trigger the same Google sign-in
            function signInWithGoogle() {
                const provider = new firebase.auth.GoogleAuthProvider();
                auth.signInWithPopup(provider).catch(err => alert('Login error: ' + err.message));
            }

            loginBtn.addEventListener('click', signInWithGoogle);
            signupBtn.addEventListener('click', signInWithGoogle);

            // ============================================================

        });
    </script>
</body>
</html>
